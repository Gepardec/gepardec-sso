name: Build Keycloak Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version and generate image tag
        id: meta
        run: |
          KC_VERSION=$(grep -E '^ARG KEYCLOAK_VERSION=' Containerfile | head -n1 | cut -d'=' -f2 | tr -d '[:space:]"')
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "kc_version=${KC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${KC_VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          build-args: |
            KEYCLOAK_VERSION=${{ steps.meta.outputs.kc_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}