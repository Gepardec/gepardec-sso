name: Build Keycloak Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version and generate image tag
        id: meta
        run: |
          KC_VERSION=$(grep -E '^ARG KEYCLOAK_VERSION=' Containerfile | head -n1 | cut -d'=' -f2 | tr -d '[:space:]"')
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "kc_version=${KC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${REGISTRY}/${REPO_LOWER}:${KC_VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "latest_tag=${REGISTRY}/${REPO_LOWER}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          build-args: |
            KEYCLOAK_VERSION=${{ steps.meta.outputs.kc_version }}
          tags: |
            ${{ steps.meta.outputs.full_tag }}
            ${{ steps.meta.outputs.latest_tag }}